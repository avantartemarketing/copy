<title>Copy Generator</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FBFAF7; --surface:#FFFFFF; --sunk:#F4F2ED;
  --line:#E5E2DA; --line-soft:#EFEDE6;
  --ink:#1C1B16; --ink-soft:#6E6B60; --ink-faint:#A6A298;
  --accent:#1F3A5F; --accent-soft:#E7ECF3; --accent-line:#C3D0E2;
  --warn:#8F4327; --warn-soft:#F8EDE8;
  --good:#3C5E3B; --good-soft:#EDF2EC;
  --field:#EDF2F8; --field-hi:#E3EBF4;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --rail:196px; --aside:340px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161512; --surface:#1D1C18; --sunk:#232219;
  --line:#343229; --line-soft:#2A2822;
  --ink:#EDEAE1; --ink-soft:#A19D91; --ink-faint:#6F6C62;
  --accent:#9BB8DC; --accent-soft:#222B37; --accent-line:#3A4757;
  --warn:#D99878; --warn-soft:#2E241E;
  --good:#9DBE9B; --good-soft:#212821;
  --field:#20272F; --field-hi:#27303A;
}}
:root[data-theme="dark"]{
  --paper:#161512; --surface:#1D1C18; --sunk:#232219;
  --line:#343229; --line-soft:#2A2822;
  --ink:#EDEAE1; --ink-soft:#A19D91; --ink-faint:#6F6C62;
  --accent:#9BB8DC; --accent-soft:#222B37; --accent-line:#3A4757;
  --warn:#D99878; --warn-soft:#2E241E;
  --good:#9DBE9B; --good-soft:#212821;
  --field:#20272F; --field-hi:#27303A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- frame ---------- */
.top{display:flex;align-items:center;gap:14px;height:52px;padding-inline:20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.mark{font-family:var(--serif);font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.mark em{font-style:italic;color:var(--accent)}
.crumb{color:var(--ink-soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.crumb b{color:var(--ink);font-weight:500}
.ghost{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--ink-soft)}
.ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.ghost.arm{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
#camp{max-width:36ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-weight:500}
.saved{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
.saved[data-k="error"]{color:var(--warn)}
.saved[data-k="pending"],.saved[data-k="saving"]{color:var(--ink-soft)}
.camps{padding:4px 0 6px}
.camps .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 16px;border-top:1px solid var(--line-soft);cursor:pointer}
.camps .row.head2{border-top:none;cursor:default;align-items:center}
.camps .row.head2 input{flex:1}
.camps .row:not(.head2):hover{background:var(--sunk)}
.camps .row[aria-current="true"] b{color:var(--accent)}
.camps .row b{font-weight:500;min-width:0}
.camps .row span{font-size:12px;color:var(--ink-faint);white-space:nowrap}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--aside);min-height:calc(100dvh - 52px)}
nav{border-right:1px solid var(--line)}
.stick{position:sticky;top:52px;padding:22px 12px;display:flex;flex-direction:column;gap:2px}
nav .lbl{padding:0 10px 8px}
nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--ink-soft);font-size:13.5px}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav button i{font-style:normal;font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
nav button[aria-current="true"] i{color:var(--accent)}

main{padding:34px 40px 90px;min-width:0}
aside{border-left:1px solid var(--line);background:var(--surface)}
#aside{position:sticky;top:52px;max-height:calc(100dvh - 52px);overflow-y:auto;padding:26px 22px 60px}

.head{max-width:62ch;margin-bottom:26px}
.head h1{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:-.012em;margin:6px 0 7px;text-wrap:balance}
.head p{margin:0;color:var(--ink-soft);max-width:58ch}

/* ---------- the sheet ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:760px}
.meta{display:grid;grid-template-columns:88px minmax(0,1fr);gap:3px 16px;padding:18px 22px 10px;font-size:13px}
.meta dt{color:var(--ink-faint);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:2px}
.meta dd{margin:0;color:var(--ink-soft)}

.body{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:start}
.gutter{position:relative}
.tag{position:absolute;right:14px;left:8px;display:flex;align-items:flex-start;justify-content:flex-end;gap:7px;text-align:right;transition:color .15s}
.tag b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.tag u{display:block;font-size:10px;font-weight:400;letter-spacing:.01em;text-decoration:none;color:var(--ink-faint);opacity:.72;margin-top:2px;line-height:1.3}
.tag s{flex:none;width:5px;height:5px;border-radius:50%;background:var(--line);text-decoration:none;margin-top:4px}
.tag:hover b{color:var(--ink-soft)}
.tag[data-on="true"] b{color:var(--accent)}
.tag[data-on="true"] s{background:var(--accent)}
.tag[data-flag="warn"] s{background:var(--warn)}

.doc{padding:4px 26px 22px 22px;font-family:var(--serif);font-size:17.5px;line-height:1.62;color:var(--ink-soft)}
.doc p,.doc ul{margin:0 0 1.05em}
.doc ul{padding:0;list-style:none}
.doc li{position:relative;padding-left:16px}
.doc li::before{content:"·";position:absolute;left:3px}
.fld{display:block;cursor:text;color:var(--ink);background:var(--field);border-radius:5px;padding:3px 8px;margin:0 -8px;outline:none;transition:background .12s,box-shadow .12s}
.fld.in{display:inline;padding:1px 4px 1px 5px;margin:0 -4px 0 0}
.fld.in:empty{display:inline-block;min-width:2ch;vertical-align:baseline}
.lock{display:inline;padding:1px 4px 1px 5px;margin:0 -4px 0 0;border-radius:5px;background:var(--sunk);color:var(--ink-soft);cursor:default}
.fld:hover{background:var(--field-hi)}
.fld:focus{background:var(--field-hi);box-shadow:0 0 0 2px var(--accent-line)}
.fld:empty::before{content:attr(data-ph);color:var(--ink-faint);font-style:italic}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
.card{flex:0 1 172px;min-width:0;max-width:200px;border:1px solid var(--line-soft);border-radius:7px;overflow:hidden;padding-bottom:9px}
.card i{display:block;aspect-ratio:4/3;background:var(--sunk)}
.card b{display:block;padding:8px 10px 0;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.3}
.fld.cd{margin:3px 5px 0;padding:2px 5px;font-size:12.5px;line-height:1.42}
.pull{margin:22px 0 0;padding-left:14px;border-left:2px solid var(--line);font-size:16.5px;font-style:italic;line-height:1.5}
.pull cite{display:block;margin-top:6px;font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;font-style:normal;color:var(--ink-faint)}
.sig{margin:20px 0 0!important;font:600 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.cta{display:inline-block;font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 15px;border:1px solid var(--line);border-radius:6px;color:var(--ink-soft)}
.foot{display:flex;gap:8px;align-items:center;padding:13px 22px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-faint)}
.from{display:flex;align-items:center;gap:9px;margin:0;padding:0 22px 14px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.from::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.from button{font:inherit;letter-spacing:.07em;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.from.mid{padding-top:4px}
.key{display:flex;flex-direction:column;gap:8px;margin:18px 0 0;font-size:12.5px;color:var(--ink-soft);max-width:58ch}
.key span{display:flex;align-items:flex-start;gap:9px}
.key i{flex:none;width:24px;height:15px;border-radius:4px;background:var(--field);margin-top:2px}
.key i.fx{background:transparent;border:1px dashed var(--line)}
.todo{margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:11px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-soft)}
.todo li:first-child{border-top:none}
.todo s{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);text-decoration:none;align-self:center}
.todo li.done s{background:var(--good)}
.todo li.done b{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--line)}
.todo b{font-weight:500;color:var(--ink);flex:none;min-width:152px}
.panel .todo li{padding:8px 0;font-size:13px}
.panel .todo b{min-width:0}
.panel .todo span{display:none}
.todo span{color:var(--ink-faint);font-size:12.5px}
.live{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-soft)}
.pagebox{font-family:var(--serif);font-size:15.5px;line-height:1.6;min-height:280px;resize:vertical;padding:14px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tabs button{padding:6px 11px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--ink-soft);background:var(--surface);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button[aria-current="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:500}
.tabs button i{font-style:normal;color:var(--warn);margin-left:5px}
.sug{border:1px solid var(--line);border-radius:7px;padding:10px 11px;margin-bottom:8px;background:var(--paper)}
.sug h4{display:flex;align-items:baseline;gap:8px;margin:0 0 6px;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.sug h4 span{flex:1}
.sug .q{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink);white-space:pre-line}
.sug .src{font-size:11px;color:var(--ink-faint);margin-top:6px}
.sug.used{border-color:var(--good);background:var(--good-soft)}
.sug.none{border-style:dashed}
.mini{font-size:11px;font-weight:500;padding:3px 9px;border:1px solid var(--accent-line);border-radius:5px;color:var(--accent);background:var(--surface)}
.mini:hover{background:var(--accent-soft)}
.mini[disabled]{opacity:.55;cursor:default}
.sug.used .mini{border-color:var(--good);color:var(--good)}

/* ---------- aside ---------- */
.panel h2{font-family:var(--serif);font-size:19px;font-weight:400;margin:8px 0 8px;letter-spacing:-.01em}
.panel .rule{color:var(--ink-soft);font-size:13px;margin:0 0 16px}
.panel section{border-top:1px solid var(--line-soft);padding:15px 0 3px;margin-top:4px}
.panel section:first-of-type{border-top:none}
.panel h3{margin:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}

.opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-family:var(--serif);font-size:13.5px;line-height:1.45;color:var(--ink-soft)}
.opt:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.opt[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.opt u{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;color:var(--ink-faint);margin-bottom:4px}

.use{border:1px solid var(--line);border-radius:7px;padding:10px 11px;margin-bottom:7px;background:var(--paper)}
.use h4{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.use .q{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--ink-faint);white-space:pre-line}
.use .q mark{background:none;color:var(--ink);box-shadow:inset 0 -6px 0 var(--accent-soft)}

.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line-soft)}
.chk:first-of-type{border-top:none}
.chk s{flex:none;width:6px;height:6px;border-radius:50%;margin-top:6px;background:var(--good);text-decoration:none}
.chk[data-k="warn"] s{background:var(--warn)}
.chk[data-k="warn"]{color:var(--ink)}
.chk b{font-weight:600;color:var(--ink)}

.act{width:100%;padding:9px 12px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:7px;font-size:13px;font-weight:500;margin-top:8px}
.act:hover{filter:brightness(.97)}
.act[disabled]{opacity:.5;cursor:default}
.note{font-size:11.5px;color:var(--ink-faint);margin:8px 0 0;line-height:1.45}

/* ---------- facts ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px 18px;max-width:760px}
.grid.wide{grid-template-columns:1fr}
fieldset{border:none;margin:0 0 30px;padding:0;max-width:760px}
legend{padding:0;margin-bottom:3px;font-family:var(--serif);font-size:18px;font-weight:400}
fieldset>p{margin:0 0 16px;color:var(--ink-soft);font-size:13px;max-width:56ch}
label{display:block}
label span{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
label small{display:block;font-size:11px;color:var(--ink-faint);margin-top:4px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---------- outputs ---------- */
.out{max-width:760px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.out>summary{display:flex;align-items:baseline;gap:10px;padding:13px 18px;cursor:pointer;list-style:none}
.out>summary::-webkit-details-marker{display:none}
.out>summary b{font-weight:500;font-size:13.5px}
.out>summary i{font-style:normal;color:var(--ink-faint);font-size:11.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.out[open]>summary{border-bottom:1px solid var(--line-soft)}
.out pre{margin:0;padding:16px 18px 20px;font-family:var(--serif);font-size:15px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;color:var(--ink-soft)}
.na{color:var(--ink-faint);font-style:italic}
.fld.op{display:inline}
.groupline{display:flex;align-items:center;gap:12px;margin:26px 0 12px;max-width:760px}
.groupline::after{content:"";flex:1;height:1px;background:var(--line)}
.gen{padding:16px 22px;margin-bottom:14px}
.genhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.gencols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.gencols{grid-template-columns:1fr}}
.gencols pre{white-space:pre-wrap;font:inherit;font-size:13px;color:var(--ink-soft);margin:6px 0 0;line-height:1.5}
.gencols textarea{margin-top:6px;line-height:1.5;resize:vertical}
.count{font-size:11.5px;margin:6px 0 0;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.count.over{color:var(--warn)}
.genact{display:flex;gap:8px;margin-top:12px}
.genact .act{width:auto;padding:8px 14px}
.rowbar{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.rowbar select{width:auto;min-width:22ch;padding:5px 30px 5px 10px;font-size:12.5px;background-position:calc(100% - 15px) 11px,calc(100% - 10px) 11px}
.act.ghost{background:transparent}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  nav{border-right:none;border-bottom:1px solid var(--line)}
  .stick{position:static;flex-direction:row;overflow-x:auto;padding:8px 12px}
  nav .lbl{display:none}
  nav button{width:auto;white-space:nowrap}
  aside{border-left:none;border-top:1px solid var(--line)}
  #aside{position:static;max-height:none}
  main{padding:24px 16px 60px}
}
@media (max-width:560px){
  .body{grid-template-columns:1fr}
  .gutter{display:none}
  .doc{padding-inline:18px}
  .meta{grid-template-columns:1fr;gap:0 0}
  .meta dt{padding-top:9px}
}
/* the holding card: up while the page waits on Notion, the server or Claude */
#hold{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(251,250,247,.6);background:color-mix(in srgb,var(--paper) 60%,transparent);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:holdin .18s ease-out}
#hold[hidden]{display:none}
.holdcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 28px 20px;min-width:260px;max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.14);text-align:center}
.holdcard p{margin:14px 0 0;font-size:13.5px;color:var(--ink)}
.holdcard p.note{margin-top:6px;font-size:12px;color:var(--ink-faint)}
.pulse{display:flex;gap:9px;justify-content:center;height:12px;align-items:center}
.pulse i{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.25;animation:pulse 1.2s ease-in-out infinite}
.pulse i:nth-child(2){animation-delay:.2s}.pulse i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes holdin{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.pulse i{opacity:.7}}
</style>

<header class="top">
  <span class="mark">Copy <em>Generator</em></span>
  <button class="ghost" id="camp" title="Campaigns">Choose a campaign</button>
  <span class="crumb" id="crumb"></span>
  <span class="saved" id="saved"></span>
  <button class="ghost" id="new" title="Start a release outside any campaign">New release</button>
  <button class="ghost" id="theme" title="Switch theme">Theme</button>
</header>

<div class="shell">
  <nav><div class="stick">
    <span class="lbl">Release</span>
    <button data-view="facts">Details <i id="nfacts"></i></button>
    <button data-view="page">Product page <i id="npage"></i></button>
    <button data-view="write" aria-current="true">Write <i id="nwrite"></i></button>
    <button data-view="out">Everything else <i id="nout"></i></button>
  </div></nav>
  <main id="main"></main>
  <aside><div id="aside"></div></aside>
</div>
<div id="hold" hidden role="status" aria-live="polite"><div class="holdcard"><div class="pulse"><i></i><i></i><i></i></div><p id="holdtext"></p><p class="note" id="holdmore" hidden>Still working.</p></div></div>

<script>
// ═══════════════════════════════════════════════════ state
// Only three things on this screen are written by a person. Everything else is
// assembled from the release details and is not editable here, by design.
// A new release starts empty except for what is true of every release: the
// standard three features, the usual mechanic, the house window.
function blankRelease(){
  return {
    facts: {
      artist:"", collab_with:"", ordinal:"latest", handle:"", x_handle:"", surname:"", link:"", artist_voice:"first person",
      title_1:"", is_series:"no", series_name:"", artworks:1,
      edition_phrase:"", unit:"print",
      mechanic:"timed", window:"one week", launch_at:"", closes_at:"",
      beneficiary:"", beneficiary_handle:"",

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

const join = a => a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+" and "+a[a.length-1];

  d.namedX = f.artist + (f.x_handle ? ` (@${f.x_handle})` : "");
  d.collabX = f.collab_with === f.artist ? d.namedX : f.collab_with;
  d.aUnit = ("aeiou".includes((f.unit||"print")[0].toLowerCase()) ? "an " : "a ") + (f.unit||"print");

  const slots = all.map((t, i) => i).filter(i => all[i]);

function openerFrame(){
  const d = D(), L = LEADS[S.lead].head ? LEADS[S.lead] : LEADS[0], lt = L.tail ? L.tail(d) : "";
  // the sentence has one opening in it. A release that names what it supports

  return d.support
    ? { head: L.head(d), mid: d.workIntro + lt + ", ", slot: d.support.replace(/^,\s*/, ""), tail: "." }

// where does a block land, and what sits either side of it there?
function placements(key){
  const text = blk(key).trim();
  if (!text && key !== "qualifier") return [];
  const o = outputs(), hits = [];
  const scan = (list, kind) => list.forEach(x => {
    const t = x.t || "";
    const paras = t.split("\n\n");
    const vars = key==="making"
      ? [text, text.replace("printmakers at Make-Ready","our printmakers at Make-Ready"),
               text.replace("printmakers at Make-Ready","our printmakers at Make-Ready (@make__ready)")]
      : [text];
    const i = paras.findIndex(p => vars.some(v => p.includes(v)));
    if (i >= 0) hits.push({kind, name:x.n, before:paras[i-1]||"", line:paras[i], after:paras[i+1]||""});
  });
  if (key === "qualifier") {
    // the writer's words travel inside every frame that carries the work intro
    o.emails.forEach(x => {
      const paras = (x.t||"").split("\n\n");
      const i = paras.findIndex(p => p.includes(workIntro()));
      if (i >= 0) hits.push({kind:"Email", name:x.n, before:paras[i-1]||"", line:paras[i], after:paras[i+1]||""});
    });
    return hits;
  }
  scan(o.posts,"Instagram"); scan(o.tweets,"Twitter"); scan(o.emails,"Email"); scan(o.artistPosts,"The artist's Instagram"); scan(o.artistTweets,"The artist's X"); scan(o.broadcast,"Broadcast channel");
  return hits;
}

const namesArtist = t => { const s = D().surname; return !!s && new RegExp("\\b" + s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b").test(t || ""); };
// ═══════════════════════════════════════════════════ the rules each fragment is held to
const HOUSE_PROPER = new Set("Avant Arte Make-Ready UK Insiders Instagram X I I'm I'd I've It's January February March April May June July August September October November December Monday Tuesday Wednesday Thursday Friday Saturday Sunday".split(" "));
const BANNED = ["don't miss out","miss out","hurry","act now","shop now","last call","elevate","delve","dive into","tapestry of","testament to","journey through","unleash","embark","captivating","mesmerising","breathtaking","stunning","must-have","prestigious","seamless","effortless","cutting-edge","nestled","boasts","showcases","look no further","not only","at the heart of","perfect for","we're thrilled","thrilled to","excited to announce","one-of-a-kind","product","item","drop","raffle","customer"];
const US = {color:"colour",colors:"colours",realize:"realise",center:"centre",gray:"grey",favorite:"favourite",honor:"honour",catalog:"catalogue",program:"programme"};
const SPEC = {
  qualifier:{ name:"Opener", sub:"a few words", max:10,
    rule:"Pick how it opens. Add a few words only if the line reads bald without them: a phrase, not a sentence.",
    full:"Pick how it opens. The line already gives $, so blank is usually right. Add words only for a fact that belongs nowhere else.",
    taken:"Pick how it opens. “Released in support of…” fills the slot, so there is nothing to write. Name the beneficiary in the hook and the slot comes back.",
    bald:"Pick how it opens. With several works the title drops out and the line ends on the edition phrase, so a few words earn their place: a phrase, not a sentence."},
  // what the frame already says, and so whether the writer's words are wanted
  openerCarries(){
    const d = D(), f = S.facts, has = [];
    if (d.cardTitles.length === 1 && f.title_1) has.push("the work by name");
    if (f.beneficiary && !d.hookNamesBen) has.push("what it supports");
    return has;
  },
  opener:{ name:"Opener", sub:"yours", max:35,
    rule:"One sentence, written whole: the artist in full, what the edition is, and one idea that the hook then takes further. It lands in the announcement email only." },
  hook:{ name:"Hook", sub:"yours",
    rule:"Two or three sentences on the work, as editorial as you like. It must read as well mid-email as at the top of a post.", max:70 },
  making:{ name:"Making", sub:"yours",
    rule:"One sentence on how it was made. Write “printmakers at Make-Ready”; the system adds “our”.", max:45 },
  card:{ name:"Card", sub:"yours",
    rule:"One sentence on this work, 15 to 30 words. With several works, say something different about each; no need to call each one a limited edition print.", max:30 }
};
// the cards share one rule; the gutter labels the row, the aside names the card
function spec(k){
  const d = D();
  if (k === "qualifier") {
    const has = SPEC.openerCarries();
    if (d.support) return Object.assign({}, SPEC.qualifier, {sub:"none needed", rule: SPEC.qualifier.taken});
    return Object.assign({}, SPEC.qualifier, {
      sub: S.from.qualifier === "page" && blk("qualifier").trim() ? "from the page" : has.length ? "usually blank" : "a few words",
      rule: has.length ? SPEC.qualifier.full.replace("$", join(has)) : SPEC.qualifier.bald});
  }
  if (k === "card") {
    const fromPage = d.cardKeys.length && d.cardKeys.every(c => S.from[c] === "page" && blk(c).trim());
    return Object.assign({}, SPEC.card, {name: d.cardTitles.length>1 ? "Cards" : "Card",
      sub: fromPage ? "from the page" : d.cardTitles.length>1 ? "a line each" : "yours"});
  }
  if (k.startsWith("card_")) return Object.assign({}, SPEC.card, {name: "Card · " + (d.cardTitles[+k.slice(5)-1] || ""), sub: S.from[k] === "page" ? "from the page" : "yours"});
  return S.from[k] === "page" ? Object.assign({}, SPEC[k], {sub: "from the page"}) : SPEC[k];
}
function checks(key, text){
  const t = (text ?? blk(key)).trim(), out = [], low = t.toLowerCase(), f = S.facts;
  if (key === "qualifier" && D().support)
    return [{k:"good", t:`Filled by the details: “${D().support.replace(/^,\s*/, "")}”.`}];
  if (!t) {
    if (key !== "qualifier") return [{k:"warn", t:"Nothing written yet."}];
    const has = SPEC.openerCarries();
    return [has.length
      ? {k:"good", t:`Blank, rightly: the opener already gives ${join(has)}.`}
      : {k:"warn", t:"Blank, and with several works the opener ends on the edition phrase alone."}];
  }
  const words = t.split(/\s+/).length;
  BANNED.forEach(b => { if (new RegExp("(?<![\\w-])"+b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\w-])").test(low)) out.push({k:"warn", t:`Banned phrase: “${b}”`}); });
  Object.entries(US).forEach(([us,uk]) => { if (new RegExp("\\b"+us+"\\b").test(low)) out.push({k:"warn", t:`US spelling “${us}”: use “${uk}”`}); });
  if (t.includes("—")) out.push({k:"warn", t:"Em dash. The house dash is a spaced en dash."});
  if (/\w[–—]\w/.test(t) && !/\d[–—]\d/.test(t)) out.push({k:"warn", t:"Unspaced dash."});
  if (t.includes("!")) out.push({k:"warn", t:"Exclamation mark."});
  if (key !== "opener" && /\b(we|our|we're)\b/.test(low)) out.push({k:"warn", t:"“we” or “our”. The frame around this supplies those."});
  if (/limited-edition/.test(low)) out.push({k:"warn", t:"“limited-edition”: the house form has no hyphen."});
  // the frame names the artist in full before any fragment lands, so inside one it is the surname
  const artist = (f.artist || "").trim();
  if (key === "opener") {                                 // the first mention: the full name belongs here
    if (artist && !t.includes(artist)) out.push({k:"warn", t:`Does not name ${artist} in full. This is the first mention.`});
    if (!/limited edition/.test(low)) out.push({k:"warn", t:"Does not say it is a limited edition."});
    if (!/[.]$/.test(t)) out.push({k:"warn", t:"Ends without a full stop."});
    if (t.split(/(?<=[.!?])\s+/).length > 1) out.push({k:"warn", t:"More than one sentence. The hook takes it from here."});
    if (words > 35) out.push({k:"warn", t:`${words} words. The archive's openers run 22 to 27.`});
    if (/\[[^\]]*\]/.test(t)) out.push({k:"warn", t:"A blank in square brackets is still to be filled."});
    if (f.beneficiary && !low.includes(f.beneficiary.toLowerCase())) out.push({k:"good", t: D().hookNamesBen ? `The hook names ${f.beneficiary}.` : `Does not name ${f.beneficiary}, so the features list will say “Released in support of ${f.beneficiary}”.`});
  } else if (artist.split(/\s+/).length > 1 && t.includes(artist))
    out.push({k:"warn", t:`“${artist}” in full. The frame has already named them: surname only.`});
  if (/(?<!\d)\s-\s(?!\d)/.test(t)) out.push({k:"warn", t:"A hyphen as a dash. The house dash is a spaced en dash ( – )."});
  if (key === "hook" && artist && !String(f.artist_voice || "").startsWith("third") && namesArtist(t))
    out.push({k:"good", t:`Names ${D().surname}. The artist's own posts will carry the hook in the first person: Claude rewrites it for them at the generate step, for your approval.`});
  t.split(/(?<=[.!?])\s+/).forEach(sn => {
    if ((sn.match(/\s[–—-]\s/g) || []).length >= 2)
      out.push({k:"warn", t:"An aside between two dashes reads as machine-written. Use commas or a new sentence."});
  });
  if (pageText().trim()) {
    const known = new Set((pageText() + " " + pages().map(x => (x.page.medium||"")).join(" ") + " "
      + Object.values(S.facts).filter(v => typeof v === "string").join(" ")).match(/[\w'’.-]+/g) || []);
    const seen = new Set();
    for (const w of [...known]) { seen.add(w); seen.add(w.replace(/['’]s$/, "")); seen.add(w.replace(/[.'’-]+$/, "")); }
    t.split(/(?<=[.!?])\s+/).forEach(sent => sent.split(/\s+/).slice(1).forEach(tok => {
      const c = tok.replace(/^[“”‘’"'(]+|[“”‘’"'),.;:]+$/g, "").replace(/['’]s$/, "");
      if (c.length > 1 && /^[A-Z][\w'’.-]*$/.test(c) && !HOUSE_PROPER.has(c) && !seen.has(c))
        out.push({k:"warn", t:`“${c}” is on neither the product page nor the details. Where is it from?`});
    }));
  }
  if (key === "qualifier"){
    if (words > 10) out.push({k:"warn", t:`${words} words. Ten is the cap: a phrase, not a sentence.`});
    if (/[.!?]$/.test(t)) out.push({k:"warn", t:"No full stop. The frame closes the sentence."});
    if (f.artist && low.includes(f.artist.toLowerCase())) out.push({k:"warn", t:"The artist is already named in the frame."});
    if (f.beneficiary && low.includes(f.beneficiary.toLowerCase())) out.push({k:"warn", t:"The frame adds “released in support of” on its own."});
    const n = openerText().split(/\s+/).length;
    if (f.beneficiary && !D().hookNamesBen)
      out.push({k:"warn", t:`Two clauses after the dash: yours, then “released in support of ${f.beneficiary}”. ${n} words; house openers run 22 to 27.`});
    else if (n > 28)
      out.push({k:"warn", t:`${n} words with these in. House openers run 22 to 27.`});
  } else {
    if (t.includes("?")) out.push({k:"warn", t:"Rhetorical question, and this is usually a middle paragraph."});
    t.split(/(?<=[.!?])\s+/).forEach(s => { const n=s.split(/\s+/).length; if (n>35) out.push({k:"warn", t:`A sentence of ${n} words. The cap is 35.`}); });
    if (words > spec(key).max) out.push({k:"warn", t:`${words} words. Aim for under ${spec(key).max}.`});
    if (key==="making" && !/Make-Ready/.test(t)) out.push({k:"warn", t:"No Make-Ready. Fine if made elsewhere; “our” won't be added."});
    if (key.startsWith("card_")) {
      const d = D();
      if (d.cardTitles.length > 1 && /limited edition/.test(low)) out.push({k:"warn", t:"“limited edition” under each of several cards reads as filler."});
      if (d.cardKeys.some(o => o !== key && blk(o).trim().toLowerCase() === low)) out.push({k:"warn", t:"The same line as another card."});
    }
  }
  if (!out.length) out.push({k:"good", t:`Clean. ${words} word${words===1?"":"s"}, ${placements(key).length} places.`});
  return out;
}

// ---------- the holding card: up whenever the page is waiting on Notion, the server or Claude ----------

    if (el.hidden && !HOLD.t) HOLD.t = setTimeout(() => {
