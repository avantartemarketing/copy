<title>First Proof</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#FBFAF7; --surface:#FFFFFF; --sunk:#F4F2ED;
  --line:#E5E2DA; --line-soft:#EFEDE6;
  --ink:#1C1B16; --ink-soft:#6E6B60; --ink-faint:#A6A298;
  --accent:#1F3A5F; --accent-soft:#E7ECF3; --accent-line:#C3D0E2;
  --warn:#8F4327; --warn-soft:#F8EDE8;
  --good:#3C5E3B; --good-soft:#EDF2EC;
  --field:#EDF2F8; --field-hi:#E3EBF4;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --rail:196px; --aside:340px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161512; --surface:#1D1C18; --sunk:#232219;
  --line:#343229; --line-soft:#2A2822;
  --ink:#EDEAE1; --ink-soft:#A19D91; --ink-faint:#6F6C62;
  --accent:#9BB8DC; --accent-soft:#222B37; --accent-line:#3A4757;
  --warn:#D99878; --warn-soft:#2E241E;
  --good:#9DBE9B; --good-soft:#212821;
  --field:#20272F; --field-hi:#27303A;
}}
:root[data-theme="dark"]{
  --paper:#161512; --surface:#1D1C18; --sunk:#232219;
  --line:#343229; --line-soft:#2A2822;
  --ink:#EDEAE1; --ink-soft:#A19D91; --ink-faint:#6F6C62;
  --accent:#9BB8DC; --accent-soft:#222B37; --accent-line:#3A4757;
  --warn:#D99878; --warn-soft:#2E241E;
  --good:#9DBE9B; --good-soft:#212821;
  --field:#20272F; --field-hi:#27303A;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- frame ---------- */
.top{display:flex;align-items:center;gap:14px;height:52px;padding-inline:20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.mark{font-family:var(--serif);font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.mark em{font-style:italic;color:var(--accent)}
.crumb{color:var(--ink-soft);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.crumb b{color:var(--ink);font-weight:500}
.ghost{padding:5px 10px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;color:var(--ink-soft)}
.ghost:hover{border-color:var(--ink-faint);color:var(--ink)}
.ghost.arm{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--aside);min-height:calc(100dvh - 52px)}
nav{border-right:1px solid var(--line)}
.stick{position:sticky;top:52px;padding:22px 12px;display:flex;flex-direction:column;gap:2px}
nav .lbl{padding:0 10px 8px}
nav button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:6px;color:var(--ink-soft);font-size:13.5px}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
nav button i{font-style:normal;font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
nav button[aria-current="true"] i{color:var(--accent)}

main{padding:34px 40px 90px;min-width:0}
aside{border-left:1px solid var(--line);background:var(--surface)}
#aside{position:sticky;top:52px;max-height:calc(100dvh - 52px);overflow-y:auto;padding:26px 22px 60px}

.head{max-width:62ch;margin-bottom:26px}
.head h1{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:-.012em;margin:6px 0 7px;text-wrap:balance}
.head p{margin:0;color:var(--ink-soft);max-width:58ch}

/* ---------- the sheet ---------- */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:760px}
.meta{display:grid;grid-template-columns:88px minmax(0,1fr);gap:3px 16px;padding:18px 22px 10px;font-size:13px}
.meta dt{color:var(--ink-faint);font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding-top:2px}
.meta dd{margin:0;color:var(--ink-soft)}

.body{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:start}
.gutter{position:relative}
.tag{position:absolute;right:14px;left:8px;display:flex;align-items:flex-start;justify-content:flex-end;gap:7px;text-align:right;transition:color .15s}
.tag b{display:block;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.tag u{display:block;font-size:10px;font-weight:400;letter-spacing:.01em;text-decoration:none;color:var(--ink-faint);opacity:.72;margin-top:2px;line-height:1.3}
.tag s{flex:none;width:5px;height:5px;border-radius:50%;background:var(--line);text-decoration:none;margin-top:4px}
.tag:hover b{color:var(--ink-soft)}
.tag[data-on="true"] b{color:var(--accent)}
.tag[data-on="true"] s{background:var(--accent)}
.tag[data-flag="warn"] s{background:var(--warn)}

.doc{padding:4px 26px 22px 22px;font-family:var(--serif);font-size:17.5px;line-height:1.62;color:var(--ink-soft)}
.doc p,.doc ul{margin:0 0 1.05em}
.doc ul{padding:0;list-style:none}
.doc li{position:relative;padding-left:16px}
.doc li::before{content:"·";position:absolute;left:3px}
.fld{display:block;cursor:text;color:var(--ink);background:var(--field);border-radius:5px;padding:3px 8px;margin:0 -8px;outline:none;transition:background .12s,box-shadow .12s}
.fld.in{display:inline;padding:1px 4px 1px 5px;margin:0 -4px 0 0}
.fld.in:empty{display:inline-block;min-width:2ch;vertical-align:baseline}
.lock{display:inline;padding:1px 4px 1px 5px;margin:0 -4px 0 0;border-radius:5px;background:var(--sunk);color:var(--ink-soft);cursor:default}
.fld:hover{background:var(--field-hi)}
.fld:focus{background:var(--field-hi);box-shadow:0 0 0 2px var(--accent-line)}
.fld:empty::before{content:attr(data-ph);color:var(--ink-faint);font-style:italic}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 0}
.card{flex:0 1 172px;min-width:0;max-width:200px;border:1px solid var(--line-soft);border-radius:7px;overflow:hidden;padding-bottom:9px}
.card i{display:block;aspect-ratio:4/3;background:var(--sunk)}
.card b{display:block;padding:8px 10px 0;font-size:14.5px;font-weight:500;color:var(--ink);line-height:1.3}
.fld.cd{margin:3px 5px 0;padding:2px 5px;font-size:12.5px;line-height:1.42}
.pull{margin:22px 0 0;padding-left:14px;border-left:2px solid var(--line);font-size:16.5px;font-style:italic;line-height:1.5}
.pull cite{display:block;margin-top:6px;font:600 10.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;font-style:normal;color:var(--ink-faint)}
.sig{margin:20px 0 0!important;font:600 10.5px/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.cta{display:inline-block;font-family:var(--sans);font-size:12.5px;font-weight:500;padding:8px 15px;border:1px solid var(--line);border-radius:6px;color:var(--ink-soft)}
.foot{display:flex;gap:8px;align-items:center;padding:13px 22px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-faint)}
.from{display:flex;align-items:center;gap:9px;margin:0;padding:0 22px 14px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint)}
.from::after{content:"";flex:1;height:1px;background:var(--line-soft)}
.from button{font:inherit;letter-spacing:.07em;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.from.mid{padding-top:4px}
.key{display:flex;flex-direction:column;gap:8px;margin:18px 0 0;font-size:12.5px;color:var(--ink-soft);max-width:58ch}
.key span{display:flex;align-items:flex-start;gap:9px}
.key i{flex:none;width:24px;height:15px;border-radius:4px;background:var(--field);margin-top:2px}
.key i.fx{background:transparent;border:1px dashed var(--line)}
.todo{margin:0;padding:0;list-style:none}
.todo li{display:flex;gap:11px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line-soft)}
.todo li:first-child{border-top:none}
.todo s{flex:none;width:7px;height:7px;border-radius:50%;background:var(--warn);text-decoration:none;align-self:center}
.todo li.done s{background:var(--good)}
.todo li.done b{color:var(--ink-faint);text-decoration:line-through;text-decoration-color:var(--line)}
.todo b{font-weight:500;color:var(--ink);flex:none;min-width:152px}
.panel .todo li{padding:8px 0;font-size:13px}
.panel .todo b{min-width:0}
.panel .todo span{display:none}
.todo span{color:var(--ink-faint);font-size:12.5px}
.live{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-soft)}

/* ---------- aside ---------- */
.panel h2{font-family:var(--serif);font-size:19px;font-weight:400;margin:8px 0 8px;letter-spacing:-.01em}
.panel .rule{color:var(--ink-soft);font-size:13px;margin:0 0 16px}
.panel section{border-top:1px solid var(--line-soft);padding:15px 0 3px;margin-top:4px}
.panel section:first-of-type{border-top:none}
.panel h3{margin:0 0 10px;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}

.opt{display:block;width:100%;text-align:left;padding:9px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;font-family:var(--serif);font-size:13.5px;line-height:1.45;color:var(--ink-soft)}
.opt:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.opt[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.opt u{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;color:var(--ink-faint);margin-bottom:4px}

.use{border:1px solid var(--line);border-radius:7px;padding:10px 11px;margin-bottom:7px;background:var(--paper)}
.use h4{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.use .q{font-family:var(--serif);font-size:13px;line-height:1.5;color:var(--ink-faint);white-space:pre-line}
.use .q mark{background:none;color:var(--ink);box-shadow:inset 0 -6px 0 var(--accent-soft)}

.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--line-soft)}
.chk:first-of-type{border-top:none}
.chk s{flex:none;width:6px;height:6px;border-radius:50%;margin-top:6px;background:var(--good);text-decoration:none}
.chk[data-k="warn"] s{background:var(--warn)}
.chk[data-k="warn"]{color:var(--ink)}
.chk b{font-weight:600;color:var(--ink)}

.act{width:100%;padding:9px 12px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);border-radius:7px;font-size:13px;font-weight:500;margin-top:8px}
.act:hover{filter:brightness(.97)}
.act[disabled]{opacity:.5;cursor:default}
.note{font-size:11.5px;color:var(--ink-faint);margin:8px 0 0;line-height:1.45}

/* ---------- facts ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px 18px;max-width:760px}
.grid.wide{grid-template-columns:1fr}
fieldset{border:none;margin:0 0 30px;padding:0;max-width:760px}
legend{padding:0;margin-bottom:3px;font-family:var(--serif);font-size:18px;font-weight:400}
fieldset>p{margin:0 0 16px;color:var(--ink-soft);font-size:13px;max-width:56ch}
label{display:block}
label span{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
label small{display:block;font-size:11px;color:var(--ink-faint);margin-top:4px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

/* ---------- outputs ---------- */
.out{max-width:760px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.out>summary{display:flex;align-items:baseline;gap:10px;padding:13px 18px;cursor:pointer;list-style:none}
.out>summary::-webkit-details-marker{display:none}
.out>summary b{font-weight:500;font-size:13.5px}
.out>summary i{font-style:normal;color:var(--ink-faint);font-size:11.5px;margin-left:auto;font-variant-numeric:tabular-nums}
.out[open]>summary{border-bottom:1px solid var(--line-soft)}
.out pre{margin:0;padding:16px 18px 20px;font-family:var(--serif);font-size:15px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;color:var(--ink-soft)}
.na{color:var(--ink-faint);font-style:italic}
.groupline{display:flex;align-items:center;gap:12px;margin:26px 0 12px;max-width:760px}
.groupline::after{content:"";flex:1;height:1px;background:var(--line)}

@media (max-width:1080px){
  .shell{grid-template-columns:1fr}
  nav{border-right:none;border-bottom:1px solid var(--line)}
  .stick{position:static;flex-direction:row;overflow-x:auto;padding:8px 12px}
  nav .lbl{display:none}
  nav button{width:auto;white-space:nowrap}
  aside{border-left:none;border-top:1px solid var(--line)}
  #aside{position:static;max-height:none}
  main{padding:24px 16px 60px}
}
@media (max-width:560px){
  .body{grid-template-columns:1fr}
  .gutter{display:none}
  .doc{padding-inline:18px}
  .meta{grid-template-columns:1fr;gap:0 0}
  .meta dt{padding-top:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <span class="mark">First <em>Proof</em></span>
  <span class="crumb" id="crumb"></span>
  <button class="ghost" id="new">New release</button>
  <button class="ghost" id="theme" title="Switch theme">Theme</button>
</header>

<div class="shell">
  <nav><div class="stick">
    <span class="lbl">Release</span>
    <button data-view="write" aria-current="true">Write <i>3 blocks</i></button>
    <button data-view="facts">Details <i id="nfacts"></i></button>
    <button data-view="out">Everything else <i id="nout"></i></button>
  </div></nav>
  <main id="main"></main>
  <aside><div id="aside"></div></aside>
</div>

<script>
// ═══════════════════════════════════════════════════ state
// Only three things on this screen are written by a person. Everything else is
// assembled from the release details and is not editable here, by design.
// A new release starts empty except for what is true of every release: the
// standard three features, the usual mechanic, the house window.
function blankRelease(){
  return {
    facts: {
      artist:"", collab_with:"", ordinal:"latest", handle:"", x_handle:"", hashtag:"", link:"",
      title_1:"", is_series:"no", series_name:"", artworks:1,
      edition_phrase:"", unit:"print",
      mechanic:"timed", window:"one week", launch_at:"", closes_at:"",
      beneficiary:"", beneficiary_handle:"",
      advisor:"Sam", early_access_code:"000-000", framing_code:"", framing_percent:10,
      f1:"Signed by the artist", f2:"Individually numbered", f3:"Free worldwide shipping", f4:"", f5:"",
      quote:"", bio:""
    },
    blocks: { qualifier:"", hook:"", making:"", card_1:"", card_2:"", card_3:"" }
  };
}
// what the opener cannot be built without
const NEEDS = [
  ["artist", "The artist", "everything is “by” this name"],
  ["collab_with", "Who it is with", "the artist, or their estate"],
  ["title_1", "The title", "or the series name, for untitled works"],
  ["edition_phrase", "The edition phrase", "“a new limited edition print”"],
  ["launch_at", "When it opens", "every deadline line comes from this"],
  ["closes_at", "When it closes", ""]
];
const missing = () => NEEDS.filter(([k]) => !String(S.facts[k] ?? "").trim());

const S = {
  view: "write",
  focus: "hook",
  lead: 0,
  facts: {
    artist:"Grayson Perry", collab_with:"Grayson Perry", ordinal:"latest",
    handle:"alanmeasles", x_handle:"", hashtag:"GraysonPerry",
    link:"https://avantarte.co/grayson-perry",
    title_1:"The Changeling", is_series:"no", series_name:"", artworks:1,
    edition_phrase:"a new limited edition print", unit:"print",
    mechanic:"timed", window:"one week",
    launch_at:"2026-04-30T14:00", closes_at:"2026-05-07T14:00",
    beneficiary:"the Foundling Museum", beneficiary_handle:"foundlingmuseum",
    advisor:"Sam", early_access_code:"000-000", framing_code:"", framing_percent:10,
    f1:"Signed by the artist", f2:"Individually numbered", f3:"Free worldwide shipping", f4:"", f5:"",
    quote:"Beauty and seriousness are perhaps the most shocking tactics left to artists these days.",
    bio:"Grayson Perry has long been one of the most distinctive voices in contemporary British art. Working across ceramics, tapestry, print and sculpture, his practice examines identity, class and gender in modern society."
  },
  blocks: {
    qualifier:"",
    hook:"The Changeling portrays a child as a symbol of modern youth, exploring how technology shapes today's generations. It reimagines changeling folklore for the digital age, and is intended to be 'quite disturbing'.",
    making:"To create the edition, printmakers at Make-Ready translated a new design into a 9-colour silkscreen, capturing the vivid detail of the original drawing.",
    card_1:"Collect a limited edition print by Grayson Perry, exploring modern youth shaped by technology, produced in vivid detail through a 9-colour silkscreen print.",
    card_2:"", card_3:""
  },
  ai: {}
};

// ═══════════════════════════════════════════════════ derived
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const join = a => a.length<2 ? (a[0]||"") : a.slice(0,-1).join(", ")+" and "+a[a.length-1];

function D(){
  const f = S.facts, d = {};
  const L = new Date(f.launch_at), C = new Date(f.closes_at);
  const fmt = (x,pad) => isNaN(x) ? "[date]" : `${pad?String(x.getDate()).padStart(2,"0"):x.getDate()} ${MONTHS[x.getMonth()]}`;
  const tm  = x => isNaN(x) ? "[time]" : `${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")} UK time`;
  d.draw = f.mechanic === "draw";
  d.named = f.artist + (f.handle ? ` (@${f.handle})` : "");
  d.namedX = f.artist + (f.x_handle ? ` (@${f.x_handle})` : "");
  d.collabX = f.collab_with === f.artist ? d.namedX : f.collab_with;
  d.aUnit = ("aeiou".includes((f.unit||"print")[0].toLowerCase()) ? "an " : "a ") + (f.unit||"print");
  const n = Math.max(1, Math.min(24, Math.round(+f.artworks) || 1));
  d.artworks = n;
  // only the first n count: reducing the number puts a title out of use
  // without throwing away what was typed
  const all = Array.from({length: n}, (_, i) => f["title_" + (i+1)] || "");
  const slots = all.map((t, i) => i).filter(i => all[i]);
  const titles = slots.map(i => all[i]);
  d.series = f.is_series === "yes";
  d.work = d.series ? `the ${f.series_name} series` : join(titles.map(t=>`‘${t}’`));
  d.Work = cap(d.work);
  d.workEmail = d.series ? `the ${f.series_name} series` : join(titles);
  d.WorkEmail = cap(d.workEmail);
  d.plural = n > 1;
  d.hookNamesBen = !!(f.beneficiary && S.blocks.hook.toLowerCase().includes(f.beneficiary.toLowerCase()));
  d.support = (f.beneficiary && !d.hookNamesBen) ? `, released in support of ${f.beneficiary}` : "";
  d.benTagged = f.beneficiary ? f.beneficiary + (f.beneficiary_handle ? ` (@${f.beneficiary_handle})` : "") : "";
  d.feats = [f.f1,f.f2,f.f3,f.f4,f.f5].filter(Boolean);
  d.featLine = d.feats.join(". ") + ".";
  d.featList = d.feats.map(x=>"· "+x).join("\n");
  d.featListSupport = d.featList + ((f.beneficiary && !d.hookNamesBen) ? `\n· Released in support of ${f.beneficiary}` : "");
  d.makingOurs = S.blocks.making.replace("printmakers at Make-Ready","our printmakers at Make-Ready");
  d.makingTagged = S.blocks.making.replace("printmakers at Make-Ready","our printmakers at Make-Ready (@make__ready)");
  d.launchDate = fmt(L); d.launchDateDd = fmt(L,1); d.launchTime = tm(L); d.launchDay = isNaN(L) ? "[day]" : DAYS[L.getDay()];
  d.closeDate = fmt(C); d.closeDateDd = fmt(C,1); d.closeTime = tm(C); d.closeDay = isNaN(C) ? "[day]" : DAYS[C.getDay()];
  d.collectPhrase = f.edition_phrase.replace(" new "," ");
  d.editionCap = cap(f.edition_phrase);
  d.windowCap = cap(f.window);
  // one card per work: its title, and the line the writer gives it
  d.cardTitles = titles;                      // an untitled artwork has no card yet
  d.cardKeys = slots.map(i => "card_" + (i+1));
  d.cards = d.cardTitles.map((t,i)=>{ const l = blk(d.cardKeys[i]).trim(); return "Card: "+t+(l?"\n"+l:""); }).join("\n\n");
  d.quoteLine = f.quote ? `“${f.quote}” – ${f.artist}` : "";
  d.addWhat = d.plural ? d.aUnit : d.workEmail;
  d.framingWelcome = f.framing_code ? `As a welcome gesture, enjoy ${f.framing_percent}% off our in-house framing on your first purchase using the code ${f.framing_code} at checkout.` : "";
  d.framingRemind  = f.framing_code ? `As a reminder, you can enjoy ${f.framing_percent}% off our in-house framing on your first purchase using the code ${f.framing_code} at checkout.` : "";
  // the opener frame: what the system supplies, either side of the writer's words
  d.workIntro = (n === 1 && titles.length ? `${f.title_1}, ` : "") + f.edition_phrase;
  d.untitled = n - titles.length;   // artworks still waiting for a title
  return d;
}

// ═══════════════════════════════════════════════════ the opener's wordings
const LEADS = [
  {name:"Delighted to announce", note:"49 of your last 58 announcements",
   head:d=>`We're delighted to announce our ${S.facts.ordinal} collaboration with ${S.facts.collab_with} – `},
  {name:"Proud to present", note:"used for estates and landmark releases",
   head:d=>`We're proud to present our ${S.facts.ordinal} collaboration with ${S.facts.collab_with} – `},
  {name:"Honoured to announce", note:"Carrie Mae Weems, 2025",
   head:d=>`We're honoured to announce our ${S.facts.ordinal} collaboration with ${S.facts.collab_with} – `},
  {name:"Excited to unveil", note:"Parra, 2025",
   head:d=>`We're excited to unveil our ${S.facts.ordinal} collaboration with ${S.facts.collab_with} – `},
  {name:"Over the moon", note:"The Andy Warhol Foundation, 2026",
   head:d=>`We are over the moon to announce our ${S.facts.ordinal} collaboration with ${S.facts.collab_with} – `},
  {name:"The work first", note:"one announcement in ten opens on the artwork",
   head:d=>`We're delighted to present `, tail:d=>` by ${S.facts.artist}`}
];
// The opener is a fixed frame with one small opening in it. The head and tail are
// built from the release details and are never editable; the writer's words go between.
function openerFrame(){
  const d = D(), L = LEADS[S.lead], lt = L.tail ? L.tail(d) : "";
  // the sentence has one opening in it. A release that names what it supports
  // fills that opening itself, and the writer's words would be a second clause
  // on the same dash, so the slot is locked and the qualifier goes unused.
  return d.support
    ? { head: L.head(d), mid: d.workIntro + lt + ", ", slot: d.support.replace(/^,\s*/, ""), tail: "." }
    : { head: L.head(d), mid: d.workIntro, slot: "", tail: lt + "." };
}
function qualifier(){ const q = S.blocks.qualifier.trim(); return (q && !D().support) ? " " + q : ""; }
function workIntro(){ return D().workIntro + qualifier(); }
function openerText(){ const f = openerFrame(); return f.head + f.mid + (f.slot || qualifier()) + f.tail; }

// where does a block land, and what sits either side of it there?
function placements(key){
  const text = blk(key).trim();
  if (!text && key !== "qualifier") return [];
  const o = outputs(), hits = [];
  const scan = (list, kind) => list.forEach(x => {
    const t = x.t || "";
    const paras = t.split("\n\n");
    const vars = key==="making"
      ? [text, text.replace("printmakers at Make-Ready","our printmakers at Make-Ready"),
               text.replace("printmakers at Make-Ready","our printmakers at Make-Ready (@make__ready)")]
      : [text];
    const i = paras.findIndex(p => vars.some(v => p.includes(v)));
    if (i >= 0) hits.push({kind, name:x.n, before:paras[i-1]||"", line:paras[i], after:paras[i+1]||""});
  });
  if (key === "qualifier") {
    // the writer's words travel inside every frame that carries the work intro
    o.emails.forEach(x => {
      const paras = (x.t||"").split("\n\n");
      const i = paras.findIndex(p => p.includes(workIntro()));
      if (i >= 0) hits.push({kind:"Email", name:x.n, before:paras[i-1]||"", line:paras[i], after:paras[i+1]||""});
    });
    return hits;
  }
  scan(o.posts,"Instagram"); scan(o.tweets,"Twitter"); scan(o.emails,"Email");
  return hits;
}

// ═══════════════════════════════════════════════════ the rules each fragment is held to
const BANNED = ["don't miss out","miss out","hurry","act now","shop now","last call","elevate","delve","dive into","tapestry of","testament to","journey through","unleash","embark","captivating","mesmerising","breathtaking","stunning","must-have","prestigious","seamless","effortless","cutting-edge","nestled","boasts","showcases","look no further","not only","at the heart of","perfect for","we're thrilled","thrilled to","excited to announce","one-of-a-kind","product","item","drop","raffle","customer"];
const US = {color:"colour",colors:"colours",realize:"realise",center:"centre",gray:"grey",favorite:"favourite",honor:"honour",catalog:"catalogue",program:"programme"};
const SPEC = {
  qualifier:{ name:"Opener", sub:"a few words", max:10,
    rule:"The frame is built from the release details. Pick how it opens, and add a few words about the work if the line reads bald without them. A phrase, not a sentence — it is reused by four other emails.",
    full:"The frame is built from the release details — pick how it opens. This release already gives $, so the line is not bald and blank is usually the right answer: more words would be a second thing hanging off the same dash. Add a few only for a fact that belongs here and nowhere else.",
    taken:"The frame is built from the release details — pick how it opens. There is nothing to write here: this release says what it supports, and that clause fills the opening in the sentence. Drop the beneficiary in the details, or name it in the hook, and the opening comes back.",
    bald:"The frame is built from the release details — pick how it opens. With more than one work the title drops out of this line, so it ends on the edition phrase and nothing else. This is where a few words about the work earn their place: a phrase, not a sentence, and it travels into four other emails."},
  // what the frame already says, and so whether the writer's words are wanted
  openerCarries(){
    const d = D(), f = S.facts, has = [];
    if (d.cardTitles.length === 1 && f.title_1) has.push("the work by name");
    if (f.beneficiary && !d.hookNamesBen) has.push("what it supports");
    return has;
  },
  hook:{ name:"Hook", sub:"yours",
    rule:"Two to three sentences about the work. As editorial as you like — this is where the release sounds like itself. The one test: it must read as well in the middle of an email as at the top of a post.", max:70 },
  making:{ name:"Making", sub:"yours",
    rule:"One sentence on how the edition was made. Write “printmakers at Make-Ready” and the system adds “our” where it belongs.", max:45 },
  card:{ name:"Card", sub:"yours",
    rule:"One sentence on this one work, 15 to 30 words, under its card in six emails. With a pair or a trio each card gets its own line, so say something different about each. The edition is described above the cards, so there is no need to call each one a limited edition print.", max:30 }
};
// the cards share one rule; the gutter labels the row, the aside names the card
function spec(k){
  const d = D();
  if (k === "qualifier") {
    const has = SPEC.openerCarries();
    if (d.support) return Object.assign({}, SPEC.qualifier, {sub:"none needed", rule: SPEC.qualifier.taken});
    return Object.assign({}, SPEC.qualifier, {
      sub: has.length ? "usually blank" : "a few words",
      rule: has.length ? SPEC.qualifier.full.replace("$", join(has)) : SPEC.qualifier.bald});
  }
  if (k === "card") return Object.assign({}, SPEC.card, {name: d.cardTitles.length>1 ? "Cards" : "Card", sub: d.cardTitles.length>1 ? "a line each" : "yours"});
  if (k.startsWith("card_")) return Object.assign({}, SPEC.card, {name: "Card · " + (d.cardTitles[+k.slice(5)-1] || "")});
  return SPEC[k];
}
function checks(key){
  const t = blk(key).trim(), out = [], low = t.toLowerCase(), f = S.facts;
  if (key === "qualifier" && D().support)
    return [{k:"good", t:`Filled by the release details: “${D().support.replace(/^,\s*/, "")}”. Nothing to write here.`}];
  if (!t) {
    if (key !== "qualifier") return [{k:"warn", t:"Nothing written yet."}];
    const has = SPEC.openerCarries();
    return [has.length
      ? {k:"good", t:`Nothing added, which is right: the opener already gives ${join(has)}.`}
      : {k:"warn", t:"Nothing added, and with more than one work the opener names none of them: it ends on the edition phrase alone."}];
  }
  const words = t.split(/\s+/).length;
  BANNED.forEach(b => { if (new RegExp("(?<![\\w-])"+b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?![\\w-])").test(low)) out.push({k:"warn", t:`Banned phrase: “${b}”`}); });
  Object.entries(US).forEach(([us,uk]) => { if (new RegExp("\\b"+us+"\\b").test(low)) out.push({k:"warn", t:`US spelling “${us}” — use “${uk}”`}); });
  if (t.includes("—")) out.push({k:"warn", t:"Em dash. The house dash is a spaced en dash."});
  if (/\w[–—]\w/.test(t) && !/\d[–—]\d/.test(t)) out.push({k:"warn", t:"Unspaced dash."});
  if (t.includes("!")) out.push({k:"warn", t:"Exclamation mark."});
  if (/\b(we|our|we're)\b/.test(low)) out.push({k:"warn", t:"“we” or “our”. The frame around this supplies those."});
  if (/limited-edition/.test(low)) out.push({k:"warn", t:"“limited-edition” — the house form has no hyphen."});
  if (key === "qualifier"){
    if (words > 10) out.push({k:"warn", t:`${words} words. Ten is the cap — a phrase, not a sentence.`});
    if (/[.!?]$/.test(t)) out.push({k:"warn", t:"No full stop. The frame closes the sentence."});
    if (f.artist && low.includes(f.artist.toLowerCase())) out.push({k:"warn", t:"The artist is already named in the frame."});
    if (f.beneficiary && low.includes(f.beneficiary.toLowerCase())) out.push({k:"warn", t:"The frame adds “released in support of” on its own."});
    const n = openerText().split(/\s+/).length;
    if (f.beneficiary && !D().hookNamesBen)
      out.push({k:"warn", t:`Two clauses after the dash now: your words, then “released in support of ${f.beneficiary}”. That is ${n} words; house openers sit between 22 and 27.`});
    else if (n > 28)
      out.push({k:"warn", t:`The opener runs to ${n} words with these in it. House openers sit between 22 and 27.`});
  } else {
    if (t.includes("?")) out.push({k:"warn", t:"Rhetorical question. It assumes the reader is at the start, and most of the time this is a middle paragraph."});
    t.split(/(?<=[.!?])\s+/).forEach(s => { const n=s.split(/\s+/).length; if (n>35) out.push({k:"warn", t:`A sentence of ${n} words. The cap is 35.`}); });
    if (words > spec(key).max) out.push({k:"warn", t:`${words} words. Aim for under ${spec(key).max}.`});
    if (key==="making" && !/Make-Ready/.test(t)) out.push({k:"warn", t:"No mention of Make-Ready. Fine if this edition was made elsewhere — the system just won't add “our”."});
    if (key.startsWith("card_")) {
      const d = D();
      if (d.cardTitles.length > 1 && /limited edition/.test(low)) out.push({k:"warn", t:"“limited edition” on a card. With several works it reads as filler under each one — the edition is described above the cards."});
      if (d.cardKeys.some(o => o !== key && blk(o).trim().toLowerCase() === low)) out.push({k:"warn", t:"The same line as another card."});
    }
  }
  if (!out.length) out.push({k:"good", t:`Clean. ${words} word${words===1?"":"s"}, ${placements(key).length} places.`});
  return out;
}

// ═══════════════════════════════════════════════════ render
const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const crumb = () => { const f=S.facts;
  $("#crumb").innerHTML = (f.artist||f.title_1)
    ? `<b>${esc(f.artist||"Untitled artist")}</b> &middot; ${esc(f.title_1||"untitled")} &middot; ${f.mechanic==="draw"?"draw":f.window}`
    : `<b>New release</b> &middot; nothing entered yet`; };

function render(){
  crumb();
  const o = outputs();
  $("#nout").textContent = o.posts.length + o.tweets.length + o.emails.length;
  $("#nfacts").textContent = shownFields();

  else if (S.view === "facts") { renderFacts(); $("#aside").innerHTML = asideFacts(); }
  else { renderOut(); $("#aside").innerHTML = missing().length ? asideFacts() : asideOut(); }
}

// ---------- write: the email, with three fields in it and nothing else editable ----------
const PH = {
  qualifier:" + a few words ",
  hook:"What is this work? Two or three sentences, as editorial as you like.",

function wireLock(root){
  root.querySelectorAll(".lock").forEach(el => el.onclick = () => { S.focus = "qualifier"; drawGutter(); renderAside(); });
}
function wireFields(root){
  root.querySelectorAll(".fld").forEach(el => {
    el.addEventListener("input", () => onField(el));
    el.addEventListener("focus", () => { S.focus = el.dataset.k; drawGutter(); renderAside(); });
    el.addEventListener("paste", e => {
      e.preventDefault();
      const txt = (e.clipboardData||window.clipboardData).getData("text").replace(/\s+/g," ").trim();
      document.execCommand("insertText", false, txt);
    });
    el.addEventListener("keydown", e => { if (e.key === "Enter") e.preventDefault(); });
    // an empty inline field has no text node, and some engines will not put the
    // caret in one on a click. Place it ourselves. A field with words in it is
    // left alone, so clicking mid-word still lands where you clicked.
    el.addEventListener("pointerdown", e => {
      if (el.textContent.trim()) return;
      e.preventDefault();
      caret(el);
    });
  });
}
function openerHTML(){
  const fr = openerFrame();

  // where the opening wording is chosen
  return `<span id="ohead">${esc(fr.head + fr.mid)}</span>`
       + (fr.slot ? `<span class="lock">${esc(fr.slot)}</span>` : fld("qualifier"))
       + `<span id="otail">${esc(fr.tail)}</span>`;
}
// put the caret at the start of a field, and keep it there
function caret(el){
  el.focus();
  const r = document.createRange(); r.selectNodeContents(el); r.collapse(true);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function onField(el){
  S.blocks[el.dataset.k] = el.innerText.replace(/\s+/g," ").trim();
  // deleting the last word can leave a stray <br>, which loses :empty and the
  // placeholder with it. Clear it out and put the caret back.
  if (!el.textContent.trim() && el.innerHTML !== "") { el.innerHTML = ""; caret(el); }
  S.ai[el.dataset.k] = undefined;
  syncFrame();
  const o = outputs(), live = o.emails.filter(e=>!e.t.startsWith("—")).length;
  const foot = $("#foot");
  if (foot) foot.textContent = `Then: ${o.posts.length} posts, ${o.tweets.length} tweets and ${live} more emails come from what you write here.`;
  drawGutter(); renderAside();
}
// the opener's frame can move while you type: naming the beneficiary in the hook
// drops "released in support of" from the opener. Update the locked text, never the field.
function syncFrame(){
  const p = document.querySelector('[data-blk="qualifier"]'); if (!p) return;
  const fr = openerFrame();
  if (!!p.querySelector(".lock") !== !!fr.slot) {         // the opening changed hands
    p.innerHTML = openerHTML();
    wireFields(p); wireLock(p);
    return;
  }
  const h = $("#ohead"), tl = $("#otail"), lk = p.querySelector(".lock");
  if (h && h.textContent !== fr.head + fr.mid) h.textContent = fr.head + fr.mid;
  if (tl && tl.textContent !== fr.tail) tl.textContent = fr.tail;
  if (lk && lk.textContent !== fr.slot) lk.textContent = fr.slot;
}
function drawGutter(){
  const g = $("#gutter"); if (!g) return;
  const top = g.getBoundingClientRect().top;
  g.innerHTML = Array.from(document.querySelectorAll("[data-blk]")).map(el => {
    const k = el.dataset.blk, y = el.getBoundingClientRect().top - top + 3;
    const keys = k === "card" ? D().cardKeys : [k];
    const warn = keys.some(x => checks(x).some(c => c.k === "warn")), on = keys.includes(S.focus);
    return `<button class="tag" data-jump="${keys[0]}" data-on="${on}" data-flag="${warn?"warn":""}" style="top:${y}px">`
         + `<span><b>${spec(k).name}</b><u>${esc(spec(k).sub)}</u></span><s></s></button>`;
  }).join("");
  g.querySelectorAll("[data-jump]").forEach(b => b.onclick = () => {
    const el = document.querySelector(`.fld[data-k="${b.dataset.jump}"]`);
    if (!el) { S.focus = b.dataset.jump; drawGutter(); renderAside(); return; }
    { el.focus();
      const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
}

const trim = s => s.length > 210 ? s.slice(0,205).replace(/\s\S*$/,"") + "…" : s;
function renderAI(r){
  if (!r) return "";
  if (r.verdict === "good") return `<div class="chk" data-k="good"><s></s><span><b>Claude:</b> ${esc(r.summary||"Reads well everywhere.")}</span></div>`;
  return `<div class="chk" data-k="warn"><s></s><span><b>Claude:</b> ${esc(r.summary||"")}</span></div>` +
    (r.issues||[]).map(i=>`<div class="chk" data-k="warn"><s></s><span><b>${esc(i.where||"")}</b> ${esc(i.note||"")}${i.fix?`<br><em>Try:</em> ${esc(i.fix)}`:""}</span></div>`).join("");
}

async function proofread(k){
  S.ai[k] = {busy:true}; renderAside();
  try{
    const sample = await claude.use("sample");
    if (!sample) throw new Error("unavailable");
    const hits = placements(k);
    const ctx = hits.map((h,i)=>`${i+1}. ${h.kind} — ${h.name}\n${h.before?h.before+"\n\n":""}>>> ${h.line}\n${h.after?"\n"+h.after:""}`).join("\n\n");
    const res = await sample.json(
`You are proofreading one fragment of copy for Avant Arte, a publisher of limited edition artworks. The same fragment is reused across a campaign, so it has to work in every place it lands.

THE FRAGMENT — the "${spec(k).name}":
${blk(k) || "(empty)"}

WHAT IT IS FOR: ${spec(k).rule}

EVERY PLACE IT LANDS, with the copy either side of it (the fragment is marked >>>):
${ctx}

HOUSE RULES: British spelling. The house dash is a spaced en dash, never an em dash. No exclamation marks and no rhetorical questions. Sentences under 35 words. Times written as "14:00 UK time", dates as "30 April". Never say "we" or "our" inside the fragment — the frame around it supplies those. Every fact must be true of this release: do not invent dates, numbers, places or names.

Judge two things. First, does the fragment read well on its own? Second, and more important, does it still read well in EACH place above — check especially whether it assumes it is the first thing being read, because in most of these places it is a middle paragraph. Also flag repetition with the copy either side of it.

Be sparing. Only report real problems a careful editor would raise. Ignore matters of taste.

Reply with JSON only, no other text:
{"verdict":"good"|"fix","summary":"one short sentence","issues":[{"where":"the place, or 'everywhere'","note":"one sentence","fix":"a suggested rewrite, or null"}]}`,
      {modelTier:"default"});
    S.ai[k] = {res};
  }catch(e){
    S.ai[k] = {err: (e && e.code === "not_granted") ? "Claude was not allowed to run here." : "Could not reach Claude just now. The mechanical checks above still apply."};
  }
  renderAside();
}

function cardNote(){

  if (d.untitled === n) return `${many}, so ${card(n)} once ${n===1?"it is":"they are"} titled.` + series;

  return `${many}, so ${card(n)}.` + series + (head > 90
